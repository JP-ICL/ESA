# Generated by `paper init`. Compiles the paper and publishes the PDF without
# ever committing it to this branch:
#
#   push to main  ->  the PDF is force-pushed to an orphan branch `pdf`
#                                   (GitHub renders it in the browser; one commit, no history bloat)
#                                   and attached to a rolling prerelease tagged `draft`
#   push a tag v*               ->  permanent release with that PDF
name: paper

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: writeup
          root_file: esa_report.tex

      - name: Name the PDF
        run: cp "writeup/esa_report.pdf" "esa.pdf"

      - name: Publish PDF to the `pdf` branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          work=$(mktemp -d)
          cp "esa.pdf" "$work/"
          cd "$work"
          git init -q -b pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            printf '> **This branch holds only the compiled PDF: [esa.pdf](esa.pdf)** (built from %s).\n' "${GITHUB_SHA::7}"
            printf '> The source is on [`main`](https://github.com/%s/tree/main).\n\n' "$GITHUB_REPOSITORY"
            cat "$GITHUB_WORKSPACE/README.md" 2>/dev/null || true
          } > README.md
          git add .
          git commit -q -m "Build of $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pdf

      - name: Move the draft tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f draft
          git push -f origin draft

      - name: Publish rolling draft release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: draft
          name: Latest draft
          body: "Automatic build of ${{ github.sha }}. Not a release."
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: "esa.pdf"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: "esa.pdf"
